ar insumos, custos e decantes com precisão.</p> </div> <!-- Perfis Odilon e Ursula --> <div class="space-y-3"> <label class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Quem está acessando?</label> <div class="grid grid-cols-2 gap-3"> <!-- Odilon --> <button type="button" id="btn-perfil-odilon" onclick="selecionarPerfil('Odilon')" class="p-4 rounded-xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left"> <div class="w-10 h-10 rounded-full bg-brand-gold/20 border border-brand-gold flex items-center justify-center text-brand-gold font-bold text-lg"> O </div> <div> <div class="font-semibold text-white group-hover:text-brand-gold transition-colors">Odilon</div> <div class="text-[11px] text-brand-gold flex items-center gap-1 mt-0.5"> <span>Ativo</span> </div> </div> <div id="check-odilon" class="absolute top-3 right-3 w-5 h-5 rounded-full bg-brand-gold text-black flex items-center justify-center text-xs font-bold"> ✓ </div> </button> <!-- Ursula --> <button type="button" id="btn-perfil-ursula" onclick="selecionarPerfil('Ursula')" class="p-4 rounded-xl border border-brand-cardBorder bg-brand-card/60 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left opacity-75"> <div class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 font-bold text-lg group-hover:border-brand-gold group-hover:text-brand-gold transition-colors"> U </div> <div> <div class="font-semibold text-white group-hover:text-brand-gold transition-colors">Ursula</div> <div class="text-[11px] text-zinc-400 flex items-center gap-1 mt-0.5"> <span>Pronta</span> </div> </div> <div id="check-ursula" class="absolute top-3 right-3 w-5 h-5 rounded-full bg-brand-gold text-black hidden items-center justify-center text-xs font-bold"> ✓ </div> </button> </div> </div> <!-- Info de Sessão --> <div class="bg-brand-card/50 border border-brand-cardBorder p-3.5 rounded-xl flex items-center justify-between text-xs text-zinc-300"> <span>Sessão atual:</span> <span id="nome-exibicao" class="font-bold text-brand-gold">Odilon</span> </div> <!-- Botão Entrar --> <button type="button" onclick="entrarNoAtelie()" class="w-full py-3.5 px-4 bg-brand-gold hover:bg-brand-goldLight active:bg-brand-goldDark text-black font-semibold rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-lg shadow-brand-gold/10 text-sm"> <span>ENTRAR NO ATELIÊ</span> <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /> </svg> </button> </main> <!-- Rodapé --> <footer class="text-center pt-4 border-t border-brand-cardBorder/60 text-[11px] text-zinc-500"> King Decantes Ateliê &bull; Sincronização em Nuvem Supabase </footer> </div> <script> let usuarioSelecionado = 'Odilon'; function selecionarPerfil(nome) { usuarioSelecionado = nome; document.getElementById('nome-exibicao').innerText = nome; const btnO = document.getElementById('btn-perfil-odilon'); const btnU = document.getElementById('btn-perfil-ursula'); const checkO = document.getElementById('check-odilon'); const checkU = document.getElementById('check-ursula'); if (nome === 'Odilon') { btnO.className = 'p-4 rounded-xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left'; btnO.classList.remove('opacity-75'); checkO.classList.remove('hidden'); checkO.classList.add('flex'); btnU.className = 'p-4 rounded-xl border border-brand-cardBorder bg-brand-card/60 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left opacity-75'; checkU.classList.add('hidden'); checkU.classList.remove('flex'); } else { btnU.className = 'p-4 rounded-xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left'; btnU.classList.remove('opacity-75'); checkU.classList.remove('hidden'); checkU.classList.add('flex'); btnO.className = 'p-4 rounded-xl border border-brand-cardBorder bg-brand-card/60 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden group text-left opacity-75'; checkO.classList.add('hidden'); checkO.classList.remove('flex'); } } function entrarNoAtelie() { localStorage.setItem('king_usuario_ativo', usuarioSelecionado); window.location.href = './dashboard.html'; } </script> </body> </html>
