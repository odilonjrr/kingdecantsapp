<!DOCTYPE html> <html lang="pt-BR" class="dark"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/> <title>King Decantes - Acesso ao Ateliê</title> <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script> <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/> <script> tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { gold: '#d8ac43', goldLight: '#f3c766', goldDark: '#a37e26', noir: '#131312', card: '#1c1c1a', cardBorder: '#2d2d2a', inputBg: '#181816' } }, fontFamily: { serif: ['"Bodoni Moda"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } } </script> </head> <body class="bg-[#131312] text-zinc-100 font-sans min-h-screen flex flex-col items-center justify-between p-4 selection:bg-brand-gold selection:text-black"> <div class="w-full max-w-md mx-auto flex flex-col justify-between min-h-[92vh] py-3"> <!-- Top Header com Logo Centralizada --> <header class="flex items-center justify-between border-b border-brand-cardBorder pb-3"> <div class="w-8"></div> <div class="flex items-center justify-center gap-2"> <img src="./logo.webp" alt="King Decantes" class="object-contain" style="height: 43px;" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';"/> <span id="logo-fallback" style="display:none;" class="text-brand-gold font-serif text-lg tracking-widest font-bold">KING DECANTES</span> </div> <div class="w-8"></div> </header> <!-- Conteúdo Central --> <main class="my-auto py-6 space-y-6"> <div class="text-center space-y-2"> <div class="pt-2"> <h1 class="text-3xl font-serif text-white tracking-tight mt-1">Quem está usando?</h1> </div> </div> <!-- Perfis Odilon e Ursula --> <div class="space-y-3"> <div class="grid grid-cols-2 gap-3"> <!-- Odilon --> <button type="button" id="btn-perfil-odilon" onclick="selecionarPerfil('Odilon')" class="p-4 rounded-2xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left shadow-lg shadow-brand-gold/10"> <span class="text-[9px] uppercase tracking-wider font-bold bg-brand-gold text-black px-2 py-0.5 rounded-md">ADMINISTRADOR</span> <div class="w-12 h-12 rounded-2xl bg-[#131312] border border-brand-gold/40 flex items-center justify-center text-brand-gold font-bold text-xl font-serif relative"> O <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-[#131312]"></span> </div> <div> <div class="font-semibold text-white text-base">Odilon</div> </div> <div id="check-odilon" class="absolute top-3 right-3 w-5 h-5 rounded-full bg-brand-gold text-black flex items-center justify-center text-xs font-bold"> ✓ </div> </button> <!-- Ursula --> <button type="button" id="btn-perfil-ursula" onclick="selecionarPerfil('Ursula')" class="p-4 rounded-2xl border border-brand-cardBorder bg-brand-card/50 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left opacity-70"> <span class="text-[9px] uppercase tracking-wider font-bold bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-md">ATELIÊ</span> <div class="w-12 h-12 rounded-2xl bg-[#131312] border border-zinc-700 flex items-center justify-center text-zinc-300 font-bold text-xl font-serif relative"> U <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-brand-gold border-2 border-[#131312]"></span> </div> <div> <div class="font-semibold text-white text-base">Ursula</div> </div> <div id="check-ursula" class="absolute top-3 right-3 w-5 h-5 rounded-full bg-brand-gold text-black hidden items-center justify-center text-xs font-bold"> ✓ </div> </button> </div> </div> <p class="text-center text-xs text-zinc-400">Entrar como <strong id="nome-exibicao" class="text-brand-gold">Odilon</strong></p> <!-- Botão Entrar no Ateliê --> <button type="button" onclick="entrarNoAtelie()" class="w-full py-4 px-4 bg-brand-gold hover:bg-brand-goldLight active:bg-brand-goldDark text-black font-bold rounded-2xl transition duration-150 flex items-center justify-center gap-2 shadow-xl shadow-brand-gold/20 text-sm tracking-wider"> <span>ENTRAR</span> <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /> </svg> </button> </main> </div> <script> let usuarioSelecionado = 'Odilon'; function selecionarPerfil(nome) { usuarioSelecionado = nome; document.getElementById('nome-exibicao').innerText = nome; const btnO = document.getElementById('btn-perfil-odilon'); const btnU = document.getElementById('btn-perfil-ursula'); const checkO = document.getElementById('check-odilon'); const checkU = document.getElementById('check-ursula'); if (nome === 'Odilon') { btnO.className = 'p-4 rounded-2xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left shadow-lg shadow-brand-gold/10'; checkO.classList.remove('hidden'); checkO.classList.add('flex'); btnU.className = 'p-4 rounded-2xl border border-brand-cardBorder bg-brand-card/50 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left opacity-70'; checkU.classList.add('hidden'); checkU.classList.remove('flex'); } else { btnU.className = 'p-4 rounded-2xl border-2 border-brand-gold bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left shadow-lg shadow-brand-gold/10'; btnU.classList.remove('opacity-70'); checkU.classList.remove('hidden'); checkU.classList.add('flex'); btnO.className = 'p-4 rounded-2xl border border-brand-cardBorder bg-brand-card/50 hover:bg-brand-card flex flex-col items-start gap-3 transition-all relative overflow-hidden text-left opacity-70'; checkO.classList.add('hidden'); checkO.classList.remove('flex'); } } function entrarNoAtelie() { localStorage.setItem('king_usuario_ativo', usuarioSelecionado); window.location.href = './dashboard.html'; } </script> </body> </html>
