<!DOCTYPE html> <html lang="pt-BR" class="dark"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/> <title>King Decantes - Compras & Fornecedores</title> <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script> <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/> <!-- Supabase CDN & Scripts --> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="./supabaseClient.js"></script> <script src="./app.js"></script> <script src="./nav.js"></script> <script> tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { gold: '#d8ac43', goldLight: '#f3c766', goldDark: '#a37e26', noir: '#131312', card: '#1c1c1a', cardBorder: '#2d2d2a', inputBg: '#181816' } }, fontFamily: { serif: ['"Bodoni Moda"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } } </script> </head> <body class="bg-[#131312] text-zinc-100 font-sans min-h-screen pb-24 selection:bg-brand-gold selection:text-black"> <div class="max-w-md mx-auto min-h-screen flex flex-col px-4 pt-3"> <!-- Header Superior --> <header class="flex items-center justify-between border-b border-brand-cardBorder pb-3"> <div class="flex items-center gap-2"> <a href="./dashboard.html" class="p-1 rounded-lg text-zinc-400 hover:text-white"> <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /> </svg> </a> <span class="text-brand-gold font-serif text-sm tracking-widest font-bold">KING DECANTES</span> </div> <span class="text-xs text-zinc-400 font-medium">Compras</span> <div class="flex items-center gap-1.5 text-[11px] text-brand-gold bg-brand-gold/10 px-2.5 py-1 rounded-full border border-brand-gold/20"> <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> <span id="operador-atual">Odilon</span> </div> </header> <!-- Resumo de Compras do Mês --> <section class="mt-4 grid grid-cols-2 gap-3"> <div class="p-4 rounded-2xl bg-brand-card border border-brand-cardBorder"> <span class="text-[10px] uppercase tracking-wider text-zinc-400">Total em compras</span> <div class="text-xl font-serif text-brand-gold font-bold mt-1" id="total-compras-mes">R$ 0,00</div> </div> <div class="p-4 rounded-2xl bg-brand-card border border-brand-cardBorder"> <span class="text-[10px] uppercase tracking-wider text-zinc-400">Fornecedores</span> <div class="text-xl font-serif text-white font-bold mt-1" id="total-fornecedores">0</div> </div> </section> <!-- Formulário de Registro de Entrada de Insumo / Compra --> <section class="mt-5 p-4 rounded-2xl bg-brand-card border border-brand-cardBorder space-y-4"> <h2 class="font-serif text-base font-bold text-white">Nova compra</h2> <form id="form-compra" onsubmit="salvarNovaCompra(event)" class="space-y-3"> <div> <label class="block text-[11px] font-semibold text-zinc-400 mb-1 uppercase tracking-wide">Fornecedor</label> <input type="text" id="fornecedor" required placeholder="Ex: Alpha Frascos" class="w-full bg-[#181816] border border-brand-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-brand-gold"/> </div> <div class="grid grid-cols-2 gap-3"> <div> <label class="block text-[11px] font-semibold text-zinc-400 mb-1 uppercase tracking-wide">Nº da nota</label> <input type="text" id="numero-nota" placeholder="Ex: 001234" class="w-full bg-[#181816] border border-brand-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-brand-gold"/> </div> <div> <label class="block text-[11px] font-semibold text-zinc-400 mb-1 uppercase tracking-wide">Data</label> <input type="date" id="data-compra" class="w-full bg-[#181816] border border-brand-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-gold"/> </div> </div> <div class="p-3 bg-[#181816] rounded-xl border border-brand-cardBorder space-y-2"> <div class="flex items-center justify-between text-[11px] text-brand-gold font-semibold uppercase"> <span>Item</span> </div> <div> <input type="text" id="nome-item" required placeholder="Nome (ex: Sauvage 100ml)" class="w-full bg-[#131312] border border-brand-cardBorder rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-brand-gold"/> </div> <div> <select id="categoria-item" class="w-full bg-[#131312] border border-brand-cardBorder rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold"><option value="perfume">Perfume (frasco-mãe)</option> <option value="embalagem">Embalagem (frasco, caixa)</option> <option value="artesanato">Artesanato (essência, cera)</option> <option value="acessorio">Acessório (válvula, etiqueta)</option> <option value="outro">Outro</option></select> </div> <div class="grid grid-cols-2 gap-2"> <div> <label class="block text-[10px] text-zinc-400 mb-0.5">Quantidade (ml)</label> <input type="number" step="any" id="qtd-item" required placeholder="Ex: 100" class="w-full bg-[#131312] border border-brand-cardBorder rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold"/> </div> <div> <label class="block text-[10px] text-zinc-400 mb-0.5">Valor pago (R$)</label> <input type="number" step="0.01" id="valor-total" required placeholder="Ex: 850.00" class="w-full bg-[#131312] border border-brand-cardBorder rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold"/> </div> </div> </div> <button type="submit" id="btn-salvar" class="w-full py-3.5 px-4 bg-brand-gold hover:bg-brand-goldLight text-black font-semibold rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-brand-gold/10 transition"> <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /> </svg> <span>Registrar compra</span> </button> </form> </section> <!-- Histórico Recente de Entradas --> <section class="mt-5 space-y-3"> <div class="flex items-center justify-between"> <h3 class="font-serif text-sm font-bold text-white">Histórico</h3> <span class="text-[10px] text-zinc-500 uppercase tracking-wider" id="qtd-historico">0 Entradas</span> </div> <div id="lista-compras" class="space-y-2"> <div class="text-center py-8 text-zinc-500 text-xs bg-brand-card/40 rounded-2xl border border-brand-cardBorder/60 p-4"> <p>Nenhuma compra registrada.</p> </div> </div> </section> </div> <!-- Barra de Navegação Inferior (Mobile Tabs) --> <script> /* Inicialização da tela */ document.addEventListener('DOMContentLoaded', () => { const usuario = localStorage.getItem('king_usuario_ativo') || 'Odilon'; document.getElementById('operador-atual').innerText = usuario; document.getElementById('data-compra').value = new Date().toISOString().split('T')[0]; carregarCompras(); }); async function carregarCompras() { try { if (!window.supabase) return; const { data, error } = await supabase.from('compras').select('*').order('data_compra', { ascending: false }); if (error) throw error; const lista = document.getElementById('lista-compras'); const totalMesEl = document.getElementById('total-compras-mes'); const qtdEl = document.getElementById('qtd-historico'); if (!data || data.length === 0) { totalMesEl.innerText = 'R$ 0,00'; qtdEl.innerText = '0 Entradas'; return; } qtdEl.innerText = `${data.length} Entrada${data.length > 1 ? 's' : ''}`; let totalMes = 0; lista.innerHTML = ''; data.forEach(item => { totalMes += Number(item.valor_total || 0); /* data sem hora (AAAA-MM-DD) é lida ao meio-dia para não voltar um dia no fuso do Brasil */ const dataFmt = item.data_compra ? new Date(String(item.data_compra).length === 10 ? item.data_compra + 'T12:00:00' : item.data_compra).toLocaleDateString('pt-BR') : '-'; lista.innerHTML += ` <div class="p-3 bg-brand-card border border-brand-cardBorder rounded-xl flex items-center justify-between"> <div> <div class="text-xs font-semibold text-white">${item.fornecedor || 'Fornecedor'}</div> <div class="text-[10px] text-zinc-500 mt-0.5">${dataFmt}${item.numero_nota ? ' • NF ' + item.numero_nota : ''}</div> </div> <div class="text-right"> <span class="text-xs font-bold text-brand-gold">R$ ${Number(item.valor_total || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span> </div> </div> `; }); totalMesEl.innerText = `R$ ${totalMes.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`; document.getElementById('total-fornecedores').innerText = new Set(data.map(c => (c.fornecedor || '').trim().toLowerCase()).filter(Boolean)).size; } catch (err) { console.error('Erro ao buscar compras:', err); } } async function salvarNovaCompra(e) { e.preventDefault(); const btn = document.getElementById('btn-salvar'); btn.innerText = 'Salvando...'; btn.disabled = true; try { const fornecedor = document.getElementById('fornecedor').value; const numero_nota = document.getElementById('numero-nota').value; const data_compra = document.getElementById('data-compra').value; const nomeItem = document.getElementById('nome-item').value; const qtdItem = parseFloat(document.getElementById('qtd-item').value || 0); const valorTotal = parseFloat(document.getElementById('valor-total').value || 0); const usuario = localStorage.getItem('king_usuario_ativo') || 'Odilon'; /* 1. Grava a compra na tabela 'compras' */ if (window.supabase) { const { error: errCompra } = await supabase.from('compras').insert([{ fornecedor, numero_nota, data_compra: data_compra || new Date().toISOString(), valor_total: valorTotal, criado_por: usuario }]); if (errCompra) throw errCompra; /* 2. Grava o item na tabela 'insumos' para atualizar o estoque */ const custoUnit = qtdItem > 0 ? (valorTotal / qtdItem) : valorTotal; const { error: errInsumo } = await supabase.from('insumos').insert([{ nome: nomeItem, categoria: document.getElementById('categoria-item').value, quantidade_estoque: qtdItem, unidade_medida: 'ml', custo_unitario: custoUnit, fornecedor: fornecedor, criado_por: usuario }]); if (errInsumo) throw errInsumo; } alert('Compra registrada e insumo adicionado ao estoque!'); document.getElementById('form-compra').reset(); document.getElementById('data-compra').value = new Date().toISOString().split('T')[0]; carregarCompras(); } catch (err) { alert('Erro ao gravar: ' + (err.message || err)); } finally { btn.innerText = 'Registrar compra'; btn.disabled = false; } } </script> </body> </html>
