<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_19 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // ============================================================
// King Decantes - Lógica de Conexão e Dados (app.js)
// ============================================================

// 1. Identificação do Usuário Ativo (Odilon ou Ursula)
function obterUsuarioAtivo() {
  return localStorage.getItem('king_usuario_ativo') || 'Odilon';
}

function definirUsuarioAtivo(nome) {
  localStorage.setItem('king_usuario_ativo', nome);
  console.log('Usuário ativo definido para:', nome);
}

// 2. Funções de Insumos & Matérias-Primas (Perfumes frasco-mãe, vidros, caixas, etc)
async function cadastrarInsumo(dados) {
  try {
    const usuario = obterUsuarioAtivo();
    const { data, error } = await supabase
      .from('insumos')
      .insert([
        {
          nome: dados.nome,
          categoria: dados.categoria,
          quantidade_estoque: parseFloat(dados.quantidade_estoque || 0),
          unidade_medida: dados.unidade_medida || 'un',
          custo_unitario: parseFloat(dados.custo_unitario || 0),
          fornecedor: dados.fornecedor || '',
          criado_por: usuario
        }
      ])
      .select();

    if (error) throw error;
    alert('Insumo cadastrado com sucesso!');
    return data;
  } catch (err) {
    console.error('Erro ao cadastrar insumo:', err);
    alert('Erro ao salvar insumo: ' + err.message);
  }
}

async function listarInsumos() {
  try {
    const { data, error } = await supabase
      .from('insumos')
      .select('*')
      .order('nome', { ascending: true });

    if (error) throw error;
    return data || [];
  } catch (err) {
    console.error('Erro ao buscar insumos:', err);
    return [];
  }
}

// 3. Funções de Formulação & Decantes / Produtos Finais
async function cadastrarProduto(dados) {
  try {
    const usuario = obterUsuarioAtivo();
    const { data, error } = await supabase
      .from('produtos')
      .insert([
        {
          nome: dados.nome,
          categoria: dados.categoria || 'Decante',
          tamanho_ml: parseFloat(dados.tamanho_ml || 0),
          custo_total: parseFloat(dados.custo_total || 0),
          preco_venda_sugerido: parseFloat(dados.preco_venda_sugerido || 0),
          margem_lucro_pct: parseFloat(dados.margem_lucro_pct || 0),
          criado_por: usuario
        }
      ])
      .select();

    if (error) throw error;
    alert('Produto/Decante cadastrado com sucesso!');
    return data;
  } catch (err) {
    console.error('Erro ao cadastrar produto:', err);
    alert('Erro ao salvar produto: ' + err.message);
  }
}

async function listarProdutos() {
  try {
    const { data, error } = await supabase
      .from('produtos')
      .select('*')
      .order('nome', { ascending: true });

    if (error) throw error;
    return data || [];
  } catch (err) {
    console.error('Erro ao buscar produtos:', err);
    return [];
  }
}

// 4. Registro de Compras & Notas Fiscais
async function registrarCompra(dados) {
  try {
    const usuario = obterUsuarioAtivo();
    const { data, error } = await supabase
      .from('compras')
      .insert([
        {
          fornecedor: dados.fornecedor,
          data_compra: dados.data_compra || new Date().toISOString(),
          valor_total: parseFloat(dados.valor_total || 0),
          numero_nota: dados.numero_nota || '',
          criado_por: usuario
        }
      ])
      .select();

    if (error) throw error;
    alert('Entrada de compra registrada com sucesso!');
    return data;
  } catch (err) {
    console.error('Erro ao registrar compra:', err);
    alert('Erro ao registrar compra: ' + err.message);
  }
}

// 5. Cálculo Dinâmico de Custo de Decante
function calcularCustoDecante({ custoFrascoMae, volumeFrascoMaeMl, fracionamentoMl, custoFlaconete, custoEtiqueta, custoEmbalagem }) {
  const custoPorMl = volumeFrascoMaeMl > 0 ? (custoFrascoMae / volumeFrascoMaeMl) : 0;
  const custoLiquido = custoPorMl * fracionamentoMl;
  const custoMaterial = (custoFlaconete || 0) + (custoEtiqueta || 0) + (custoEmbalagem || 0);
  const custoTotal = custoLiquido + custoMaterial;

  return {
    custoLiquido: parseFloat(custoLiquido.toFixed(2)),
    custoMaterial: parseFloat(custoMaterial.toFixed(2)),
    custoTotal: parseFloat(custoTotal.toFixed(2))
  };
}

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_19 -->
</body>
</html>
