<script>
  let todasReceitas = [];
  let filtroReceita = '';

  function renderizarReceitas() {
    const lista = document.getElementById('lista-receitas');
    const itens = todasReceitas.filter(p => !filtroReceita || (p.categoria || '').toLowerCase().includes(filtroReceita));
    if (itens.length === 0) {
      lista.innerHTML = '<p class="bg-surface-container p-space-md rounded-xl text-center font-body-sm text-body-sm text-on-surface-variant">Nenhuma receita aqui.</p>';
      return;
    }
    lista.innerHTML = itens.map(p => `
      <div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-2">
        <div class="flex items-center justify-between gap-space-sm">
          <span class="font-title-md text-title-md text-on-surface font-semibold truncate">${escaparHtml(p.nome)}</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase shrink-0">${escaparHtml(p.categoria || '')}</span>
        </div>
        ${p.rendimento ? `<span class="font-label-sm text-label-sm text-on-surface-variant">Rende ${String(p.rendimento).replace('.', ',')} ${escaparHtml(p.unidade_rendimento || 'un')} • ${formatarReais(p.custo_total / p.rendimento)} por ${escaparHtml(p.unidade_rendimento || 'un')}</span>` : ''}
        <div class="grid grid-cols-3 gap-2 font-label-sm text-label-sm">
          <div class="flex flex-col"><span class="text-on-surface-variant uppercase">Custo</span><span class="font-body-md text-body-md text-on-surface">${formatarReais(p.custo_total)}</span></div>
          <div class="flex flex-col"><span class="text-on-surface-variant uppercase">Preço</span><span class="font-body-md text-body-md text-primary font-semibold">${formatarReais(p.preco_venda_sugerido)}</span></div>
          <div class="flex flex-col"><span class="text-on-surface-variant uppercase">Margem</span><span class="font-body-md text-body-md text-cash-positive">${(parseFloat(p.margem_lucro_pct) || 0).toFixed(1).replace('.', ',')}%</span></div>
        </div>
      </div>`).join('');
  }

  document.getElementById('filtros-categoria').addEventListener('click', ev => {
    const pill = ev.target.closest('.category-pill');
    if (!pill) return;
    document.querySelectorAll('.category-pill').forEach(p => {
      p.classList.remove('bg-primary', 'text-on-primary', 'active');
      p.classList.add('bg-surface-container', 'text-on-surface-variant');
    });
    pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
    pill.classList.add('bg-primary', 'text-on-primary', 'active');
    filtroReceita = pill.dataset.category;
    renderizarReceitas();
  });

  // Categorias criadas pelo usuário ganham um filtro próprio
  function adicionarFiltrosNovos() {
    const container = document.getElementById('filtros-categoria');
    const chaves = [...container.querySelectorAll('.category-pill')].map(p => p.dataset.category).filter(Boolean);
    const vistas = new Set();
    todasReceitas.forEach(p => {
      const nome = (p.categoria || '').trim();
      const chave = nome.toLowerCase();
      if (!nome || vistas.has(chave) || chaves.some(k => chave.includes(k))) return;
      vistas.add(chave);
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'category-pill px-4 py-2 rounded-full font-label-md text-label-md uppercase tracking-wider transition-all bg-surface-container text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high';
      pill.dataset.category = chave;
      pill.textContent = nome;
      container.appendChild(pill);
    });
  }

  window.addEventListener('DOMContentLoaded', async () => {
    todasReceitas = await listarProdutos();
    adicionarFiltrosNovos();
    renderizarReceitas();
  });
</script>
