</div>
<div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-1">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">Produtos</span>

</div>
<div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-1">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">Margem média</span>
<span class="font-title-md text-title-md text-cash-positive font-semibold" id="kpi-margem">0%</span>
</div>
</section>
<section class="grid grid-cols-2 gap-space-sm">

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabaseClient.js"></script>
<script src="./app.js"></script>
<script>
  document.getElementById('nome-operador').textContent = localStorage.getItem('king_usuario_ativo') || 'Odilon';

  window.addEventListener('DOMContentLoaded', async () => {
    const [insumos, produtos] = await Promise.all([listarInsumos(), listarProdutos()]);

    const valorEstoque = insumos.reduce((s, i) => s + (parseFloat(i.custo_unitario) || 0) * (parseFloat(i.quantidade_estoque) || 0), 0);
    const margens = produtos.map(p => parseFloat(p.margem_lucro_pct)).filter(m => !isNaN(m));
    const margemMedia = margens.length ? margens.reduce((a, b) => a + b, 0) / margens.length : 0;

    document.getElementById('kpi-estoque').textContent = formatarReais(valorEstoque);
    document.getElementById('kpi-produtos').textContent = produtos.length;
    document.getElementById('kpi-margem').textContent = margemMedia.toFixed(1).replace('.', ',') + '%';

    const lista = document.getElementById('lista-produtos');
    if (produtos.length === 0) {
      lista.innerHTML = '<p class="bg-surface-container p-space-md rounded-xl text-center font-body-sm text-body-sm text-on-surface-variant">Nenhum produto ainda.</p>';
      return;
    }
    lista.innerHTML = produtos.slice(0, 5).map(p => `
      <div class="bg-surface-container p-space-sm px-space-md rounded-xl flex items-center justify-between gap-space-sm">
        <span class="font-body-md text-body-md text-on-surface truncate">${escaparHtml(p.nome)}</span>
        <span class="font-label-md text-label-md text-primary font-semibold shrink-0">${formatarReais(p.preco_venda_sugerido)}</span>
      </div>`).join('');
  });
</script>
