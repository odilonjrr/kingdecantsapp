html <!DOCTYPE html> <html lang="pt-BR" class="dark"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/> <title>King Decantes - Estoque & Insumos</title> <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script> <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/> <script> tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { gold: '#d8ac43', goldLight: '#f3c766', goldDark: '#a37e26', noir: '#131312', card: '#1c1c1a', cardBorder: '#2d2d2a', inputBg: '#181816' } }, fontFamily: { serif: ['"Bodoni Moda"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } } </script> </head> <body class="bg-[#131312] text-zinc-100 font-sans min-h-screen pb-24 selection:bg-brand-gold selection:text-black"> <div class="w-full max-w-md mx-auto p-4 space-y-5"> <!-- Header --> <header class="flex items-center justify-between border-b border-brand-cardBorder pb-3 pt-2"> <div class="flex items-center gap-2"> <a href="./index.html" class="p-1 rounded-lg text-zinc-400 hover:text-white" title="Trocar Operador"> <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /> </svg> </a> <span class="text-brand-gold font-serif tracking-wider font-bold text-sm">KING DECANTES</span> </div> <div class="flex items-center gap-2"> <div class="text-[11px] bg-brand-card border border-brand-cardBorder px-2.5 py-1 rounded-full text-brand-gold flex items-center gap-1.5"> <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> <span id="label-operador">Odilon</span> </div> </div> </header> <!-- Resumo de Saldo em Estoque --> <div class="bg-gradient-to-br from-brand-card to-[#151514] border border-brand-cardBorder p-4 rounded-2xl relative overflow-hidden"> <div class="flex justify-between items-start mb-2"> <span class="text-[11px] uppercase tracking-wider text-zinc-400 font-medium">Capital Imobilizado</span> <span id="badge-total-insumos" class="text-[11px] bg-brand-gold/10 text-brand-gold border border-brand-gold/20 px-2 py-0.5 rounded-full font-medium">0 Insumos</span> </div> <div class="flex items-baseline gap-1 text-white"> <span class="text-xs text-brand-gold font-semibold">R$</span> <span id="valor-total-estoque" class="text-3xl font-serif font-bold tracking-tight">0,00</span> </div> <p class="text-[11px] text-zinc-400 mt-2 flex items-center gap-1"> <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-brand-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /> </svg> Sincronizado em tempo real no Supabase </p> </div> <!-- Busca e Botão + Novo Insumo --> <div class="flex items-center gap-2"> <div class="relative flex-1"> <input type="text" id="campo-busca" oninput="filtrarInsumos()" placeholder="Buscar frasco, perfume..." class="w-full bg-brand-card border border-brand-cardBorder text-xs text-white rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-brand-gold placeholder:text-zinc-500" /> <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-zinc-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /> </svg> </div> <button onclick="abrirModalInsumo()" class="bg-brand-gold hover:bg-brand-goldLight text-black font-semibold text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 transition shadow-sm whitespace-nowrap"> <span class="text-base font-bold leading-none">+</span> <span>Novo Insumo</span> </button> </div> <!-- Filtros de Categorias --> <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar"> <button onclick="setFiltro('todos')" id="filtro-todos" class="px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition">Todos</button> <button onclick="setFiltro('Perfume Frasco-Mãe')" id="filtro-perfume" class="px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Frascos-Mãe</button> <button onclick="setFiltro('Flaconete / Vidro')" id="filtro-vidro" class="px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Vidros</button> <button onclick="setFiltro('Embalagem / Outro')" id="filtro-embalagem" class="px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Embalagens</button> </div> <!-- Lista de Insumos --> <div class="space-y-3"> <div class="flex justify-between items-center text-xs text-zinc-400 px-1"> <span class="font-semibold uppercase tracking-wider">Itens Cadastrados</span> <button onclick="carregarListaInsumos()" class="text-brand-gold hover:underline flex items-center gap-1"> <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /> </svg> Atualizar </button> </div> <div id="container-lista" class="space-y-2"> <!-- Os itens serão carregados em tempo real do Supabase aqui --> </div> </div> </div> <!-- MODAL: CADASTRAR NOVO INSUMO --> <div id="modal-insumo" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4"> <div class="bg-brand-card border border-brand-cardBorder w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto"> <div class="flex items-center justify-between border-b border-brand-cardBorder pb-3"> <h3 class="text-sm font-bold text-white flex items-center gap-2"> <span class="text-brand-gold">✦</span> Novo Insumo / Matéria-Prima </h3> <button onclick="fecharModalInsumo()" class="text-zinc-400 hover:text-white p-1">✕</button> </div> <form id="form-insumo" onsubmit="salvarNovoInsumo(event)" class="space-y-3 text-xs"> <div> <label class="block text-zinc-400 mb-1 font-medium">Nome do Insumo ou Perfume *</label> <input type="text" id="insumo-nome" required placeholder="Ex: Creed Aventus 100ml ou Vidro 5ml" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" /> </div> <div class="grid grid-cols-2 gap-2"> <div> <label class="block text-zinc-400 mb-1 font-medium">Categoria *</label> <select id="insumo-categoria" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold"> <option value="Perfume Frasco-Mãe">Perfume Frasco-Mãe</option> <option value="Flaconete / Vidro">Flaconete / Vidro</option> <option value="Embalagem / Outro">Embalagem / Caixa</option> <option value="Outro">Outro Insumo</option> </select> </div> <div> <label class="block text-zinc-400 mb-1 font-medium">Unidade de Medida</label> <select id="insumo-unidade" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold"> <option value="ml">ml (mililitros)</option> <option value="un">un (unidades)</option> <option value="g">g (gramas)</option> </select> </div> </div> <div class="grid grid-cols-2 gap-2"> <div> <label class="block text-zinc-400 mb-1 font-medium">Qtd em Estoque *</label> <input type="number" step="0.01" id="insumo-quantidade" required placeholder="Ex: 100" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" /> </div> <div> <label class="block text-zinc-400 mb-1 font-medium">Custo Unitário (R$) *</label> <input type="number" step="0.01" id="insumo-custo" required placeholder="Ex: 850.00" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" /> </div> </div> <div> <label class="block text-zinc-400 mb-1 font-medium">Fornecedor / Loja</label> <input type="text" id="insumo-fornecedor" placeholder="Ex: Importadora VIP ou Mercado Livre" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" /> </div> <div class="pt-2 flex gap-2"> <button type="button" onclick="fecharModalInsumo()" class="w-1/3 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium rounded-xl transition"> Cancelar </button> <button type="submit" id="btn-submit-insumo" class="w-2/3 py-2.5 bg-brand-gold hover:bg-brand-goldLight text-black font-semibold rounded-xl transition shadow flex items-center justify-center gap-1.5"> <span>Salvar no Supabase</span> </button> </div> </form> </div> </div> <!-- CONEXÃO COM SUPABASE & SCRIPTS --> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="./supabaseClient.js"></script> <script src="./app.js"></script> <!-- Lógica de Operação --> <script> let todosInsumos = []; let filtroAtual = 'todos'; const operador = localStorage.getItem('king_usuario_ativo') || 'Odilon'; document.getElementById('label-operador').innerText = operador; window.addEventListener('DOMContentLoaded', () => { carregarListaInsumos(); }); function abrirModalInsumo() { document.getElementById('modal-insumo').classList.remove('hidden'); document.getElementById('modal-insumo').classList.add('flex'); } function fecharModalInsumo() { document.getElementById('modal-insumo').classList.add('hidden'); document.getElementById('modal-insumo').classList.remove('flex'); document.getElementById('form-insumo').reset(); } async function salvarNovoInsumo(e) { e.preventDefault(); const btn = document.getElementById('btn-submit-insumo'); btn.innerText = 'Salvando...'; btn.disabled = true; const dados = { nome: document.getElementById('insumo-nome').value, categoria: document.getElementById('insumo-categoria').value, unidade_medida: document.getElementById('insumo-unidade').value, quantidade_estoque: parseFloat(document.getElementById('insumo-quantidade').value), custo_unitario: parseFloat(document.getElementById('insumo-custo').value), fornecedor: document.getElementById('insumo-fornecedor').value }; try { if (typeof cadastrarInsumo === 'function') { await cadastrarInsumo(dados); } else if (typeof supabase !== 'undefined') { const usuario = localStorage.getItem('king_usuario_ativo') || 'Odilon'; const { error } = await supabase.from('insumos').insert([{ ...dados, criado_por: usuario }]); if (error) throw error; } alert('Insumo salvo no Supabase com sucesso!'); fecharModalInsumo(); await carregarListaInsumos(); } catch (err) { console.error(err); alert('Erro ao salvar: ' + err.message); } finally { btn.innerText = 'Salvar no Supabase'; btn.disabled = false; } } async function carregarListaInsumos() { try { let itens = []; if (typeof listarInsumos === 'function') { itens = await listarInsumos(); } else if (typeof supabase !== 'undefined') { const { data, error } = await supabase.from('insumos').select('*').order('nome'); if (error) throw error; itens = data || []; } todosInsumos = itens; renderizarInsumos(); } catch (err) { console.error('Erro ao listar:', err); } } function renderizarInsumos() { const container = document.getElementById('container-lista'); const busca = document.getElementById('campo-busca').value.toLowerCase(); let filtrados = todosInsumos.filter(item => { const matchBusca = item.nome.toLowerCase().includes(busca) || (item.fornecedor && item.fornecedor.toLowerCase().includes(busca)); const matchCat = filtroAtual === 'todos' || item.categoria === filtroAtual; return matchBusca && matchCat; }); let totalReais = 0; todosInsumos.forEach(item => { totalReais += (parseFloat(item.custo_unitario) || 0) * (parseFloat(item.quantidade_estoque) || 1); }); document.getElementById('valor-total-estoque').innerText = totalReais.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); document.getElementById('badge-total-insumos').innerText = `${todosInsumos.length} Insumos`; if (filtrados.length === 0) { container.innerHTML = ` <div class="bg-brand-card/60 border border-brand-cardBorder rounded-2xl p-6 text-center space-y-2"> <p class="text-xs text-zinc-400">Nenhum insumo encontrado para este filtro.</p> <button onclick="abrirModalInsumo()" class="text-xs text-brand-gold font-semibold underline">+ Cadastrar Insumo</button> </div> `; return; } container.innerHTML = filtrados.map(item => ` <div class="bg-brand-card border border-brand-cardBorder rounded-xl p-3.5 flex items-center justify-between hover:border-brand-gold/40 transition"> <div class="space-y-1"> <div class="flex items-center gap-2"> <span class="text-xs font-semibold text-white">${item.nome}</span> <span class="text-[10px] bg-brand-gold/10 text-brand-gold border border-brand-gold/20 px-1.5 py-0.2 rounded font-medium">${item.categoria || 'Geral'}</span> </div> <div class="text-[11px] text-zinc-400 flex items-center gap-2"> <span>Estoque: <strong class="text-zinc-200">${item.quantidade_estoque} ${item.unidade_medida || 'un'}</strong></span> <span>&bull;</span> <span>Cadastrado por: <strong class="text-brand-gold">${item.criado_por || 'Odilon'}</strong></span> </div> </div> <div class="text-right"> <div class="text-xs font-bold text-white">R$ ${(parseFloat(item.custo_unitario) || 0).toFixed(2)}</div> <div class="text-[10px] text-zinc-500">${item.fornecedor || 'Fornecedor n/d'}</div> </div> </div> `).join(''); } function filtrarInsumos() { renderizarInsumos(); } function setFiltro(cat) { filtroAtual = cat; const bTodos = document.getElementById('filtro-todos'); const bPerfume = document.getElementById('filtro-perfume'); const bVidro = document.getElementById('filtro-vidro'); const bEmb = document.getElementById('filtro-embalagem'); [bTodos, bPerfume, bVidro, bEmb].forEach(b => { b.className = 'px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500'; }); if (cat === 'todos') bTodos.className = 'px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition'; if (cat === 'Perfume Frasco-Mãe') bPerfume.className = 'px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition'; if (cat === 'Flaconete / Vidro') bVidro.className = 'px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition'; if (cat === 'Embalagem / Outro') bEmb.className = 'px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition'; renderizarInsumos(); } </script> </body> </html>
