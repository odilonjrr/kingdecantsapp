<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>King Decantes - Estoque & Insumos</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#d8ac43',
              goldLight: '#f3c766',
              goldDark: '#a37e26',
              noir: '#131312',
              card: '#1c1c1a',
              cardBorder: '#2d2d2a',
              inputBg: '#181816'
            }
          },
          fontFamily: {
            serif: ['"Bodoni Moda"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
<link rel="stylesheet" href="./estilo.css"></head>
<body class="bg-[#131312] text-zinc-100 font-sans min-h-screen pb-24 selection:bg-brand-gold selection:text-black">
  <div class="w-full px-5 py-4 space-y-5">
    
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-brand-cardBorder pb-3 pt-2 cabecalho-pagina">
      <div class="flex items-center gap-2">
        <a href="./dashboard.html" class="p-1 rounded-lg text-zinc-400 hover:text-white" aria-label="Voltar ao Painel">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <img src="./logo.webp" alt="King Decants" class="w-auto object-contain" style="height: 34px;">
      </div>
      <h1 class="titulo-pagina">Estoque</h1>
      <div class="flex items-center gap-2">
        <div class="text-[11px] bg-brand-card border border-brand-cardBorder px-2.5 py-1 rounded-full text-brand-gold flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="label-operador">Odilon</span>
        </div>
      </div>
    </header>

    <!-- Card de Saldo e Insumos Totais -->
    <div class="bg-gradient-to-br from-brand-card to-[#151514] border border-brand-cardBorder p-4 rounded-2xl relative overflow-hidden">
      <div class="flex justify-between items-start mb-2">
        <span class="text-[11px] uppercase tracking-wider text-zinc-400 font-medium">Valor em estoque</span>
        <span id="badge-total-insumos" class="text-[11px] bg-brand-gold/10 text-brand-gold border border-brand-gold/20 px-2 py-0.5 rounded-full font-medium">0 Insumos</span>
      </div>
      <div class="flex items-baseline gap-1 text-white">
        <span class="text-xs text-brand-gold font-semibold">R$</span>
        <span id="valor-total-estoque" class="text-3xl font-serif font-bold tracking-tight">0,00</span>
      </div>
    </div>

    <!-- Barra de Ações: Busca e Botão + Novo Insumo -->
    <div class="flex items-center gap-2">
      <div class="relative flex-1">
        <input type="text" id="campo-busca" oninput="filtrarInsumos()" placeholder="Buscar" class="w-full bg-brand-card border border-brand-cardBorder text-xs text-white rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold placeholder:text-zinc-500" />
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-zinc-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <button onclick="abrirModalInsumo()" class="bg-brand-gold hover:bg-brand-goldLight text-black font-semibold text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 transition shadow-sm whitespace-nowrap">
        <span class="text-base font-bold leading-none">+</span>
        <span>Novo</span>
      </button>
    </div>

    <!-- Filtros por Categoria -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
      <button onclick="setFiltro('todos')" data-cat="todos" class="filtro-btn px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition">Todos</button>
      <button onclick="setFiltro('perfume')" data-cat="perfume" class="filtro-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Perfumes</button>
      <button onclick="setFiltro('embalagem')" data-cat="embalagem" class="filtro-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Embalagens</button>
      <button onclick="setFiltro('artesanato')" data-cat="artesanato" class="filtro-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Artesanato</button>
      <button onclick="setFiltro('acessorio')" data-cat="acessorio" class="filtro-btn px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500">Acessórios</button>
    </div>

    <!-- Lista de Insumos Cadastrados -->
    <div class="space-y-3">
      <div class="flex justify-between items-center text-xs text-zinc-400 px-1">
        <span class="font-semibold uppercase tracking-wider">Itens</span>
        <button onclick="carregarListaInsumos()" class="text-brand-gold hover:underline flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Atualizar
        </button>
      </div>

      <!-- Container Dinâmico -->
      <div id="container-lista" class="grid grid-cols-1 lg:grid-cols-2 gap-2">
        <!-- Estado Vazio Inicial -->
        <div id="estado-vazio" class="col-span-full bg-brand-card/60 border border-brand-cardBorder rounded-2xl p-6 text-center space-y-2">
          <p class="text-xs text-zinc-400">Nenhum insumo cadastrado.</p>
          <button onclick="abrirModalInsumo()" class="text-xs text-brand-gold font-semibold underline">+ Cadastrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: CADASTRAR NOVO INSUMO -->
  <div id="modal-insumo" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-card border border-brand-cardBorder w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-brand-cardBorder pb-3">
        <h3 id="titulo-modal-insumo" class="text-sm font-bold text-white flex items-center gap-2">
          Novo insumo
        </h3>
        <button onclick="fecharModalInsumo()" class="text-zinc-400 hover:text-white p-1">✕</button>
      </div>

      <form id="form-insumo" onsubmit="salvarNovoInsumo(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-400 mb-1 font-medium">Nome *</label>
          <input type="text" id="insumo-nome" required placeholder="Ex: Creed Aventus 100ml" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-zinc-400 mb-1 font-medium">Categoria *</label>
            <select id="insumo-categoria" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold">
              <option value="perfume">Perfume (frasco-mãe)</option>
              <option value="embalagem">Embalagem (frasco, caixa)</option>
              <option value="artesanato">Artesanato (essência, cera)</option>
              <option value="acessorio">Acessório (válvula, etiqueta)</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 font-medium">Unidade</label>
            <select id="insumo-unidade" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold">
              <option value="ml">ml</option>
              <option value="un">un</option>
              <option value="g">g</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-zinc-400 mb-1 font-medium">Quantidade *</label>
            <input type="number" step="0.01" id="insumo-quantidade" required placeholder="Ex: 100" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" />
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 font-medium">Valor pago (R$) *</label>
            <input type="number" step="0.01" id="insumo-custo" required placeholder="Ex: 850.00" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" />
          </div>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">Fornecedor</label>
          <input type="text" id="insumo-fornecedor" placeholder="Opcional" class="w-full bg-brand-inputBg border border-brand-cardBorder rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-gold placeholder:text-zinc-600" />
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="fecharModalInsumo()" class="w-1/3 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium rounded-xl transition">
            Cancelar
          </button>
          <button type="submit" id="btn-submit-insumo" class="w-2/3 py-2.5 bg-brand-gold hover:bg-brand-goldLight text-black font-semibold rounded-xl transition shadow flex items-center justify-center gap-1.5">
            <span>Salvar</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONEXÃO COM SUPABASE & SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabaseClient.js"></script>
  <script src="./app.js"></script>
  <script src="./nav.js"></script>

  <!-- Lógica de Interface Conectada -->
  <script>
    let todosInsumos = [];
    let filtroAtual = 'todos';
    // Categorias aceitas pela tabela insumos (regra insumos_categoria_check)
    const NOMES_CATEGORIA = { perfume: 'Perfume', embalagem: 'Embalagem', artesanato: 'Artesanato', acessorio: 'Acessório', outro: 'Outro' };

    // Recupera usuário ativo
    const operador = localStorage.getItem('king_usuario_ativo') || 'Odilon';
    document.getElementById('label-operador').innerText = operador;

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', () => {
      carregarListaInsumos();
    });

    // id do insumo em edição (null = cadastrando um novo)
    let insumoEditandoId = null;

    function abrirModalInsumo(item) {
      insumoEditandoId = item ? item.id : null;
      document.getElementById('titulo-modal-insumo').textContent = item ? 'Editar insumo' : 'Novo insumo';
      if (item) {
        const qtd = parseFloat(item.quantidade_estoque) || 0;
        document.getElementById('insumo-nome').value = item.nome || '';
        document.getElementById('insumo-categoria').value = item.categoria || 'outro';
        document.getElementById('insumo-unidade').value = item.unidade_medida || 'un';
        document.getElementById('insumo-quantidade').value = qtd;
        // o banco guarda o custo por unidade; o formulário mostra o valor pago
        document.getElementById('insumo-custo').value = +((parseFloat(item.custo_unitario) || 0) * qtd).toFixed(2);
        document.getElementById('insumo-fornecedor').value = item.fornecedor || '';
      }
      document.getElementById('modal-insumo').classList.remove('hidden');
      document.getElementById('modal-insumo').classList.add('flex');
    }

    function editarInsumo(id) {
      const item = todosInsumos.find(i => String(i.id) === String(id));
      if (item) abrirModalInsumo(item);
    }

    async function confirmarExclusao(id) {
      const item = todosInsumos.find(i => String(i.id) === String(id));
      if (!item || !confirm(`Excluir "${item.nome}" do estoque?`)) return;
      try {
        await excluirInsumo(item.id);
        await carregarListaInsumos();
      } catch (err) {
        console.error(err);
        alert('Erro ao excluir: ' + err.message);
      }
    }

    function fecharModalInsumo() {
      document.getElementById('modal-insumo').classList.add('hidden');
      document.getElementById('modal-insumo').classList.remove('flex');
      document.getElementById('form-insumo').reset();
      insumoEditandoId = null;
    }

    async function salvarNovoInsumo(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-insumo');
      btn.innerText = 'Salvando...';
      btn.disabled = true;

      const dados = {
        nome: document.getElementById('insumo-nome').value,
        categoria: document.getElementById('insumo-categoria').value,
        unidade_medida: document.getElementById('insumo-unidade').value,
        quantidade_estoque: parseFloat(document.getElementById('insumo-quantidade').value),
        // custo por ml/un/g = valor pago ÷ quantidade
        custo_unitario: (parseFloat(document.getElementById('insumo-custo').value) || 0) /
          (parseFloat(document.getElementById('insumo-quantidade').value) || 1),
        fornecedor: document.getElementById('insumo-fornecedor').value
      };

      try {
        if (insumoEditandoId !== null) {
          await atualizarInsumo(insumoEditandoId, dados);
        } else if (typeof cadastrarInsumo === 'function') {
          await cadastrarInsumo(dados);
        } else if (typeof supabase !== 'undefined') {
          // Fallback direto caso app.js não tenha carregado
          const usuario = localStorage.getItem('king_usuario_ativo') || 'Odilon';
          const { error } = await supabase.from('insumos').insert([{ ...dados, criado_por: usuario }]);
          if (error) throw error;
          alert('Insumo salvo no Supabase com sucesso!');
        }
        fecharModalInsumo();
        await carregarListaInsumos();
      } catch (err) {
        console.error(err);
        alert('Erro ao salvar: ' + err.message);
      } finally {
        btn.innerText = 'Salvar';
        btn.disabled = false;
      }
    }

    async function carregarListaInsumos() {
      try {
        let itens = [];
        if (typeof listarInsumos === 'function') {
          itens = await listarInsumos();
        } else if (typeof supabase !== 'undefined') {
          const { data, error } = await supabase.from('insumos').select('*').order('nome');
          if (error) throw error;
          itens = data || [];
        }

        todosInsumos = itens;
        renderizarInsumos();
      } catch (err) {
        console.error('Erro ao listar:', err);
      }
    }

    function renderizarInsumos() {
      const container = document.getElementById('container-lista');
      const busca = document.getElementById('campo-busca').value.toLowerCase();

      let filtrados = todosInsumos.filter(item => {
        const matchBusca = item.nome.toLowerCase().includes(busca) || (item.fornecedor && item.fornecedor.toLowerCase().includes(busca));
        const matchCat = filtroAtual === 'todos' || item.categoria === filtroAtual;
        return matchBusca && matchCat;
      });

      // Atualizar totalizadores
      let totalReais = 0;
      todosInsumos.forEach(item => {
        totalReais += (parseFloat(item.custo_unitario) || 0) * (parseFloat(item.quantidade_estoque) || 1);
      });
      document.getElementById('valor-total-estoque').innerText = totalReais.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('badge-total-insumos').innerText = `${todosInsumos.length} Insumos`;

      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-brand-card/60 border border-brand-cardBorder rounded-2xl p-6 text-center space-y-2">
            <p class="text-xs text-zinc-400">Nada encontrado.</p>
            <button onclick="abrirModalInsumo()" class="text-xs text-brand-gold font-semibold underline">+ Cadastrar</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtrados.map(item => `
        <div class="bg-brand-card border border-brand-cardBorder rounded-xl p-3.5 flex items-center justify-between gap-2 hover:border-brand-gold/40 transition">
          <div class="space-y-1 min-w-0 flex-1">
            <!-- nome sozinho na linha e com quebra: aparece inteiro mesmo no celular -->
            <div class="text-xs font-semibold text-white leading-snug break-words">${escaparHtml(item.nome)}</div>
            <div class="text-[11px] text-zinc-400 flex flex-wrap items-center gap-x-2 gap-y-1">
              <span class="text-[10px] bg-brand-gold/10 text-brand-gold border border-brand-gold/20 px-1.5 py-0.2 rounded font-medium">${NOMES_CATEGORIA[item.categoria] || item.categoria || 'Outro'}</span>
              <span>Estoque: <strong class="text-zinc-200">${item.quantidade_estoque} ${item.unidade_medida || 'un'}</strong></span>
              <span class="text-zinc-500">${escaparHtml(item.criado_por || 'Odilon')}</span>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <div class="text-right">
              <div class="text-xs font-bold text-white">${formatarReais(item.custo_unitario)}/${item.unidade_medida || 'un'}</div>
              <div class="text-[10px] text-zinc-500">${escaparHtml(item.fornecedor || '')}</div>
            </div>
            <button type="button" onclick="editarInsumo('${item.id}')" aria-label="Editar" title="Editar" class="w-8 h-8 rounded-lg bg-[#181816] border border-brand-cardBorder text-zinc-300 hover:text-brand-gold hover:border-brand-gold/40 flex items-center justify-center transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.232-6.232a2.5 2.5 0 113.536 3.536L12.536 16.536 8 18l1.464-4.536z"/></svg></button>
            <button type="button" onclick="confirmarExclusao('${item.id}')" aria-label="Excluir" title="Excluir" class="w-8 h-8 rounded-lg bg-[#181816] border border-brand-cardBorder text-zinc-300 hover:text-red-400 hover:border-red-400/40 flex items-center justify-center transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/></svg></button>
          </div>
        </div>
      `).join('');
    }

    function filtrarInsumos() {
      renderizarInsumos();
    }

    function setFiltro(cat) {
      filtroAtual = cat;
      document.querySelectorAll('.filtro-btn').forEach(b => {
        b.className = 'filtro-btn ' + (b.dataset.cat === cat
          ? 'px-3 py-1.5 rounded-lg bg-brand-gold text-black font-medium transition'
          : 'px-3 py-1.5 rounded-lg bg-brand-card border border-brand-cardBorder text-zinc-300 font-medium transition hover:border-zinc-500');
      });
      renderizarInsumos();
    }
  </script>
</body>
</html>
